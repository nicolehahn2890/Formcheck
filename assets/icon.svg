<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Hintergrund: Peach (Vollbild, iOS rundet die Ecken selbst) -->
  <rect x="0" y="0" width="512" height="512" fill="#F4A45E"/>

  <!-- Neobrutalism: harter Offset-Schatten + cream-Karte mit Ink-Rand -->
  <rect x="86" y="88" width="356" height="356" rx="60" fill="#181016"/>
  <rect x="72" y="72" width="356" height="356" rx="60" fill="#FBF3E7" stroke="#181016" stroke-width="12"/>

  <!-- schlanker Tiefen-Balken (App-Element) -->
  <rect x="388" y="148" width="20" height="216" rx="10" fill="#E9DEF8" stroke="#181016" stroke-width="7"/>
  <rect x="391.5" y="276" width="13" height="84.5" rx="6.5" fill="#F4A45E"/>

  <!-- Figur in der Kniebeuge (Seitenansicht), bold Ink -->
  <g fill="none" stroke="#181016" stroke-width="23" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="180" x2="242" y2="162"/>            <!-- Hals -->
    <line x1="250" y1="180" x2="210" y2="280"/>            <!-- Oberkörper -->
    <line x1="210" y1="280" x2="320" y2="285"/>            <!-- Oberschenkel -->
    <line x1="320" y1="285" x2="300" y2="380"/>            <!-- Schienbein -->
    <line x1="300" y1="380" x2="358" y2="388"/>            <!-- Fuß -->
  </g>

  <!-- Kniewinkel (das Herz der App): Keil + Bogen in Grün -->
  <path d="M320 285 L310.0 331.9 A48 48 0 0 1 272.05 282.8 Z" fill="#6FC36A" opacity="0.32"/>
  <path d="M310.0 331.9 A48 48 0 0 1 272.05 282.8" fill="none" stroke="#6FC36A" stroke-width="12" stroke-linecap="round"/>

  <!-- Kopf -->
  <circle cx="238" cy="138" r="28" fill="#F4A45E" stroke="#181016" stroke-width="9"/>

  <!-- Gelenke (gemessene Punkte) grün hervorgehoben -->
  <g fill="#6FC36A" stroke="#181016" stroke-width="7">
    <circle cx="250" cy="180" r="12"/>
    <circle cx="210" cy="280" r="16"/>
    <circle cx="320" cy="285" r="17"/>
    <circle cx="300" cy="380" r="15"/>
  </g>
</svg>
