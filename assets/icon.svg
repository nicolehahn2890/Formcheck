<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Hintergrund: Peach (Vollbild, iOS rundet die Ecken selbst) -->
  <rect x="0" y="0" width="512" height="512" fill="#F4A45E"/>

  <!-- Harter Offset-Schatten des Winkelmessers (Neobrutalism) -->
  <path d="M86 350 A180 180 0 0 1 446 350 Z" fill="#181016"/>

  <!-- Winkelmesser (Halbkreis), cream mit Ink-Rand -->
  <path d="M76 338 A180 180 0 0 1 436 338 Z" fill="#FBF3E7" stroke="#181016" stroke-width="14" stroke-linejoin="round"/>

  <!-- kleiner Winkel-Marker am Drehpunkt (grüner Akzent) -->
  <path d="M256 338 L346 338 A90 90 0 0 0 307.6 264.2 Z" fill="#6FC36A"/>

  <!-- Skalenstriche -->
  <g stroke="#181016" stroke-width="7" stroke-linecap="round">
    <line x1="412.4" y1="247.0" x2="391.1" y2="238.2"/>  <!-- 30 Grad -->
    <line x1="361.0" y1="195.0" x2="345.4" y2="178.3"/>  <!-- 60 Grad -->
    <line x1="256.0" y1="180.0" x2="256.0" y2="157.0"/>  <!-- 90 Grad -->
    <line x1="151.0" y1="195.0" x2="166.6" y2="178.3"/>  <!-- 120 Grad -->
    <line x1="99.6"  y1="247.0" x2="120.9" y2="238.2"/>  <!-- 150 Grad -->
  </g>

  <!-- Winkel-Zeiger -->
  <line x1="256" y1="338" x2="359.2" y2="190.5" stroke="#181016" stroke-width="15" stroke-linecap="round"/>

  <!-- Drehpunkt -->
  <circle cx="256" cy="338" r="15" fill="#FBF3E7" stroke="#181016" stroke-width="10"/>
</svg>
