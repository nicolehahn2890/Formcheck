<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Hintergrund: Peach (Vollbild, iOS rundet die Ecken selbst) -->
  <rect x="0" y="0" width="512" height="512" fill="#F4A45E"/>

  <!-- grüner Bogen, den die Zirkelspitze zieht -->
  <path d="M330 388 A232 232 0 0 1 182 388" fill="none" stroke="#6FC36A" stroke-width="14" stroke-linecap="round"/>

  <!-- Zirkel-Schenkel (cremfarben, Ink-Rand), kräftig & leicht zugespitzt -->
  <g fill="#FBF3E7" stroke="#181016" stroke-width="13" stroke-linejoin="round">
    <polygon points="274.9,172.4 237.1,159.6 177.4,381.8 190.6,386.2"/>   <!-- linker Schenkel -->
    <polygon points="237.1,172.4 274.9,159.6 334.6,381.8 321.4,386.2"/>   <!-- rechter Schenkel -->
  </g>

  <!-- Spitzen (Nadel & Mine) -->
  <g fill="#181016">
    <polygon points="182,404 190.6,386.2 177.4,381.8"/>   <!-- Nadelspitze links -->
    <polygon points="330,404 321.4,386.2 334.6,381.8"/>   <!-- Minenspitze rechts -->
  </g>

  <!-- Drehkopf oben -->
  <line x1="256" y1="120" x2="256" y2="172" stroke="#181016" stroke-width="20" stroke-linecap="round"/>
  <circle cx="256" cy="108" r="26" fill="#FBF3E7" stroke="#181016" stroke-width="12"/>

  <!-- Gelenk / Drehpunkt -->
  <circle cx="256" cy="170" r="17" fill="#6FC36A" stroke="#181016" stroke-width="10"/>
</svg>
